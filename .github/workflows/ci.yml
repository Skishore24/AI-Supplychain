name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: supply_chain_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/supply_chain_db
        run: |
          cd backend
          python -m alembic upgrade head
          python seed.py

      - name: Run SaaS Platform Tests
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/supply_chain_db
        run: |
          python -m pytest tests/test_saas_platform.py -v

      - name: Run AI Platform Tests
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/supply_chain_db
        run: |
          python -m pytest tests/test_ai_platform.py -v

  frontend-build:
    name: Frontend Build & Type Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Production Bundle
        run: |
          cd frontend
          npm run build
